[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipc-classifier"
version = "0.1.0"
description = "A hierarchical neural network model for multi-label text classification of patent data."
authors = [{name = "Dr. Farhad Allian", email = "farhad.allian@sheffield.ac.uk"}]
license = {text = "MIT"}
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
keywords = ["API", "UKRI", "classification", "machine learning", "python"]
dependencies = [
    "requests>=2.32",
    "pandas>=2.0",
    "urllib3>=2.3",
    "numpy>=1.2",
    "openpyxl>=3.1",
    "torch>=2.0",
    "transformers>=4.53",
    "datasets>=2.14",
    "scikit-learn>=1.3",
    "tqdm>=4.6",
    "urllib3>=2.5",

]

[project.urls]
"Homepage" = "https://github.com/rcgsheffield/ipc-classifier"
"Bug Tracker" = "https://github.com/rcgsheffield/ipc-classifier/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "black>=25.1",
    "isort>=6.0",
    "pylint>=3.3",
    "pre-commit>=4.1",
]

[tool.setuptools.packages.find]
include = ["*"]
